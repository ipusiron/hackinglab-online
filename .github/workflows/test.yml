name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["Update tools.json"]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
